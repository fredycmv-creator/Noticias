sonar.projectName=Pulso Noticias
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=tests,tools
sonar.test.inclusions=tests/**/*.php,tools/verificar_http.php
sonar.php.coverage.reportPaths=coverage/clover.xml
sonar.php.tests.reportPath=coverage/phpunit-junit.xml
# Sin exclusiones de carpetas ni exclusiones de cobertura.
# La clave del proyecto y la conexión se establecen en el pipeline institucional.
