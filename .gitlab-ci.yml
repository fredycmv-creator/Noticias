# Análisis de Noticias mediante el trabajo de calidad del laboratorio universitario.
include:
  - project: "root/laboratorio-devops"
    ref: "main"
    file: "/gitlab/jobs/quality.yml"

stages:
  - quality

variables:
  FRAMEWORK_HOME: "/workspace/laboratorio-devops"
  FRAMEWORK_METADATA: "$CI_PROJECT_DIR/metadata"

quality:
  before_script:
    - python3 tools/prepare_sonar_university.py
  script:
    - |
      set -euo pipefail
      bash "${FRAMEWORK_HOME}/core/engines/quality.sh" | tee "${FRAMEWORK_METADATA}/quality.log"
      grep -Fq 'SonarScanner analysis completed successfully.' "${FRAMEWORK_METADATA}/quality.log"
